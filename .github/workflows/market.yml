name: market

# Hourly price snapshot (quotes + history) for the deployed dashboard.
on:
  schedule:
    - cron: "7 * * * 1-5" # hourly, Mon–Fri (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-market.txt

      - run: pip install -r backend/requirements-market.txt

      - name: Snapshot market data
        run: python backend/snapshot_market.py --out data-out

      # Live tanker positions. Skipped quietly until the AISSTREAM_API_KEY
      # secret exists (free key: https://aisstream.io, sign in with GitHub).
      - name: Snapshot AIS tanker positions
        id: ais
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python backend/snapshot_ais.py --out data-out --seconds 180

      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/data-branch.sh push data-out "Market snapshot $(date -u +%FT%TZ)" \
            market.json history-1M.json history-3M.json history-6M.json history-1Y.json history-5Y.json
          if [ -f data-out/tankers.json ]; then
            .github/scripts/data-branch.sh push data-out "AIS snapshot $(date -u +%FT%TZ)" tankers.json
          fi
